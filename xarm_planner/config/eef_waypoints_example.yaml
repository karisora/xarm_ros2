eef_waypoint_commander_node:
  ros__parameters:
    robot_type: xarm
    dof: 6
    prefix: ""
    pose_reference_link: link_tcp
    wait_each: true
    # true: ignore waypoint orientation and plan by position only.
    # This usually matches an RViz test where only the goal position matters.
    position_only: true
    # true: Cartesian interpolation between waypoints (>=2 points required)
    # false: Pose-to-pose planning for each waypoint
    # Note: if any waypoint includes gripper/gripper_deg, execution falls back to sequential mode.
    use_cartesian: false
    # autonomous_controller path switching:
    # - waypoint: always plan from waypoints
    # - record_path: plan from waypoints and save exact joint trajectory
    # - replay_path: ignore waypoints and replay saved trajectory file
    # - auto: replay saved trajectory if present, otherwise plan and save it
    path_mode: replay_path
    saved_path_file: ~/dev_ws/saved_paths/xarm6_pick_path.yaml
    waypoint_count: 7
    waypoints:
      0:
        # [x, y, z] in meters, expressed for link_tcp
        # arm diff 0.292945 - 0.267815 = 0.03223, so 0.30 is a safe starting point for the first waypoint
        position: [0.30, 0.00, 0.25]
        # [qx, qy, qz, qw] for link_tcp. Ignored when position_only=true.
        orientation: [1.0, 0.0, 0.0, 0.0]
        # Optional gripper target. `gripper` is radians, `gripper_deg` is also supported.
        gripper: 0.0
      1:
        position: [0.267815, 0.25669, 0.18993]
        orientation: [0.00086109, 0.70937, -0.00083113, 0.70483]
        gripper: 0.0
      2:
        position: [0.267815, 0.292945, 0.18993]
        orientation: [0.00086109, 0.70937, -0.00083113, 0.70483]
        gripper_deg: 35.0
      3:
        position: [0.301, 0.292945, 0.18993]
        orientation: [0.00086109, 0.70937, -0.00083113, 0.70483]
        gripper_deg: 37.0
      4:
        position: [0.301, 0.292945, 0.074495]
        orientation: [0.00086109, 0.70937, -0.00083113, 0.70483]
        gripper_deg: 37.0
      5:
        position: [0.301, 0.292945, 0.074495]
        orientation: [0.00086109, 0.70937, -0.00083113, 0.70483]
        gripper_deg: 39.0
      6:
        position: [0.301, 0.292945, 0.18993]
        orientation: [0.00086109, 0.70937, -0.00083113, 0.70483]
        gripper_deg: 39.0


